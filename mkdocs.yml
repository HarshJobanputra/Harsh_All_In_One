      - "SOLID Principles & Design Patterns": "01-architecture/solid-and-design-patterns.md"
  - "2. Database Engineering":
      - "Schema Design & Indexing": "02-database-engineering/schema-design-indexing.md"
      - "Concurrency & Locking (Pessimistic vs Optimistic)": "02-database-engineering/concurrency-optimistic-pessimistic-locking.md"
      - "N+1 Query Elimination": "02-database-engineering/n-plus-one-query-optimization.md"
      - "Soft Deletes & Audit Logging": "02-database-engineering/soft-delete-and-auditing.md"
      - "Connection Pooling & PgBouncer": "02-database-engineering/connection-pooling-pgbouncer.md"
  - "3. API Engineering":
      - "REST Standards & Response Envelope": "03-api-engineering/rest-standards-response-envelope.md"
